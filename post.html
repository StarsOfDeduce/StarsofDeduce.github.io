<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>文章阅读 · StarsOfDeduce</title>
  <link rel="icon" href="./avatar.png" type="image/png">
  <script src="./js/marked.min.js"></script>
  <style>
    :root {
      --bg-base: #0a0d14;
      --bg-surface: rgba(18, 24, 38, 0.7);
      --bg-surface-hover: rgba(26, 34, 52, 0.85);
      --border-subtle: rgba(255, 255, 255, 0.08);
      --border-focus: rgba(99, 102, 241, 0.4);
      --accent-cyan: #00f2fe;
      --accent-blue: #4facfe;
      --accent-purple: #8b5cf6;
      --text-main: #f3f4f6;
      --text-muted: #9ca3af;
      --text-dim: #6b7280;
      --code-bg: rgba(0, 0, 0, 0.4);
      --font-sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
      --font-mono: "JetBrains Mono", Consolas, Monaco, monospace;
      --radius-lg: 20px;
      --radius-md: 14px;
      --card-blur: blur(20px);
    }

    [data-theme="light"] {
      --bg-base: #f0f4f9;
      --bg-surface: rgba(255, 255, 255, 0.78);
      --bg-surface-hover: rgba(255, 255, 255, 0.95);
      --border-subtle: rgba(15, 23, 42, 0.08);
      --border-focus: rgba(99, 102, 241, 0.35);
      --accent-cyan: #0284c7;
      --accent-blue: #2563eb;
      --accent-purple: #7c3aed;
      --text-main: #0f172a;
      --text-muted: #475569;
      --text-dim: #94a3b8;
      --code-bg: rgba(241, 245, 249, 0.9);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background-color: var(--bg-base);
      color: var(--text-main);
      font-family: var(--font-sans);
      min-height: 100vh;
      line-height: 1.8;
      transition: background-color 0.3s ease, color 0.3s ease;
      position: relative;
    }

    #space-canvas {
      position: fixed;
      top: 0; left: 0; width: 100vw; height: 100vh;
      z-index: 0; pointer-events: none;
    }

    .ambient-glow {
      position: fixed; border-radius: 50%; filter: blur(120px); pointer-events: none; z-index: 0; opacity: 0.3;
    }
    .glow-1 { top: -10%; left: 20%; width: 500px; height: 500px; background: radial-gradient(circle, rgba(99, 102, 241, 0.45), transparent 70%); }
    .glow-2 { bottom: 10%; right: 15%; width: 500px; height: 500px; background: radial-gradient(circle, rgba(0, 242, 254, 0.3), transparent 70%); }

    .article-container {
      position: relative;
      z-index: 1;
      max-width: 860px;
      margin: 0 auto;
      padding: 30px 20px 80px;
    }

    .nav-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px 22px;
      background: var(--bg-surface);
      backdrop-filter: var(--card-blur);
      border: 1px solid var(--border-subtle);
      border-radius: 100px;
      margin-bottom: 30px;
    }

    .btn-glass {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 6px 16px;
      border-radius: 100px;
      font-size: 0.85rem;
      color: var(--text-main);
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid var(--border-subtle);
      text-decoration: none;
      cursor: pointer;
      transition: all 0.2s;
    }
    .btn-glass:hover {
      background: rgba(255, 255, 255, 0.12);
      transform: translateY(-1px);
    }

    .article-card {
      background: var(--bg-surface);
      backdrop-filter: var(--card-blur);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-lg);
      padding: 40px;
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
    }

    /* Markdown 排版增强 */
    .markdown-body h1 {
      font-size: 2rem;
      font-weight: 800;
      margin-bottom: 16px;
      line-height: 1.3;
      background: linear-gradient(135deg, var(--text-main) 60%, var(--accent-purple) 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .markdown-body h2 {
      font-size: 1.45rem;
      font-weight: 700;
      margin: 32px 0 16px;
      padding-bottom: 8px;
      border-bottom: 1px solid var(--border-subtle);
      color: var(--text-main);
    }
    .markdown-body h3 {
      font-size: 1.18rem;
      font-weight: 600;
      margin: 24px 0 12px;
      color: var(--accent-cyan);
    }
    .markdown-body p {
      margin-bottom: 18px;
      color: var(--text-muted);
      font-size: 1.02rem;
    }
    .markdown-body blockquote {
      border-left: 4px solid var(--accent-cyan);
      padding: 10px 18px;
      background: rgba(255, 255, 255, 0.03);
      border-radius: 0 var(--radius-md) var(--radius-md) 0;
      margin-bottom: 20px;
      color: var(--text-dim);
    }
    .markdown-body pre {
      background: var(--code-bg);
      border: 1px solid var(--border-subtle);
      padding: 18px;
      border-radius: var(--radius-md);
      overflow-x: auto;
      margin-bottom: 24px;
      font-family: var(--font-mono);
      font-size: 0.9rem;
    }
    .markdown-body code {
      font-family: var(--font-mono);
      background: rgba(255, 255, 255, 0.08);
      padding: 2px 6px;
      border-radius: 4px;
      font-size: 0.88em;
      color: var(--accent-cyan);
    }
    .markdown-body pre code {
      background: transparent;
      padding: 0;
      color: var(--text-main);
    }
    .markdown-body ul, .markdown-body ol {
      margin-bottom: 20px;
      padding-left: 24px;
      color: var(--text-muted);
    }
    .markdown-body li { margin-bottom: 8px; }
    .markdown-body hr {
      border: none;
      border-top: 1px solid var(--border-subtle);
      margin: 30px 0;
    }
    .markdown-body a {
      color: var(--accent-cyan);
      text-decoration: none;
    }
    .markdown-body a:hover {
      text-decoration: underline;
    }

    .other-posts {
      margin-top: 40px;
      padding-top: 24px;
      border-top: 1px solid var(--border-subtle);
    }
    .other-posts h3 {
      font-size: 1.1rem;
      margin-bottom: 16px;
      color: var(--text-main);
    }
    .other-list {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
      gap: 12px;
    }
    .other-card {
      padding: 14px 18px;
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-md);
      text-decoration: none;
      color: var(--text-main);
      transition: all 0.2s;
    }
    .other-card:hover {
      background: rgba(255, 255, 255, 0.08);
      border-color: var(--border-focus);
      transform: translateY(-2px);
    }
    .other-card-title {
      font-size: 0.92rem;
      font-weight: 600;
      margin-bottom: 4px;
    }
    .other-card-date {
      font-size: 0.76rem;
      color: var(--text-dim);
    }

    @media (max-width: 640px) {
      .article-card { padding: 22px 18px; }
      .markdown-body h1 { font-size: 1.55rem; }
    }
  </style>
</head>
<body>
  <canvas id="space-canvas"></canvas>
  <div class="ambient-glow glow-1"></div>
  <div class="ambient-glow glow-2"></div>

  <div class="article-container">
    <nav class="nav-bar">
      <a href="./index.html" class="btn-glass">
        ← 返回主页
      </a>
      <div style="display: flex; gap: 8px;">
        <button id="theme-btn" class="btn-glass" onclick="toggleTheme()">
          <span id="theme-icon">☀️</span> <span id="theme-text">白天模式</span>
        </button>
      </div>
    </nav>

    <article class="article-card">
      <div id="content" class="markdown-body">
        <p style="text-align: center; color: var(--text-dim); padding: 40px;">正在加载文章推演内容...</p>
      </div>

      <div class="other-posts">
        <h3>📚 更多推演笔记</h3>
        <div class="other-list">
          <a href="post.html?id=tar-v-design" class="other-card">
            <div class="other-card-title">Tar V 架构与设计</div>
            <div class="other-card-date">2026-10-10 · 桌面美化</div>
          </a>
          <a href="post.html?id=windhawk-mods" class="other-card">
            <div class="other-card-title">深入 WindHawk 定制系统</div>
            <div class="other-card-date">2026-10-05 · C++ / Win32</div>
          </a>
          <a href="post.html?id=glassmorphism-web" class="other-card">
            <div class="other-card-title">探索极客美学与 Bento Grid</div>
            <div class="other-card-date">2026-10-01 · Web 设计</div>
          </a>
        </div>
      </div>
    </article>
  </div>

  <script>
    // 亮暗色主题管理
    const currentTheme = localStorage.getItem('theme') || 'dark';
    applyTheme(currentTheme);

    function toggleTheme() {
      const active = document.documentElement.getAttribute('data-theme') === 'light' ? 'dark' : 'light';
      applyTheme(active);
      localStorage.setItem('theme', active);
    }

    function applyTheme(t) {
      document.documentElement.setAttribute('data-theme', t);
      const icon = document.getElementById('theme-icon');
      const text = document.getElementById('theme-text');
      if (t === 'light') {
        icon.innerText = '🌙';
        text.innerText = '暗黑星空';
      } else {
        icon.innerText = '☀️';
        text.innerText = '白天模式';
      }
    }

    // 动态解析并渲染对应文章
    const urlParams = new URLSearchParams(window.location.search);
    const postId = urlParams.get('id') || 'tar-v-design';

    fetch(`./posts/${postId}.md`)
      .then(res => {
        if (!res.ok) throw new Error('文章未找到');
        return res.text();
      })
      .then(markdown => {
        document.getElementById('content').innerHTML = marked.parse(markdown);
        // 动态更新页面标题为文章一级标题
        const h1 = document.querySelector('.markdown-body h1');
        if (h1) document.title = `${h1.innerText} · StarsOfDeduce`;
      })
      .catch(err => {
        document.getElementById('content').innerHTML = `
          <h2>未找到此推演文章</h2>
          <p>抱歉，请求的文章不存在或已被归档。</p>
          <a href="./index.html" class="btn-glass" style="margin-top: 14px;">返回主页</a>
        `;
      });

    // 背景星空粒子
    const canvas = document.getElementById('space-canvas');
    const ctx = canvas.getContext('2d');
    let width, height, stars = [];

    function resizeCanvas() {
      width = canvas.width = window.innerWidth;
      height = canvas.height = window.innerHeight;
      stars = [];
      for (let i = 0; i < 60; i++) {
        stars.push({
          x: Math.random() * width,
          y: Math.random() * height,
          radius: Math.random() * 1.5 + 0.5,
          vx: (Math.random() - 0.5) * 0.3,
          vy: (Math.random() - 0.5) * 0.3,
          alpha: Math.random() * 0.7 + 0.3
        });
      }
    }

    function drawStars() {
      ctx.clearRect(0, 0, width, height);
      const isLight = document.documentElement.getAttribute('data-theme') === 'light';
      ctx.fillStyle = isLight ? 'rgba(99, 102, 241, 0.4)' : 'rgba(165, 180, 252, 0.6)';

      stars.forEach(s => {
        s.x += s.vx; s.y += s.vy;
        if (s.x < 0) s.x = width; if (s.x > width) s.x = 0;
        if (s.y < 0) s.y = height; if (s.y > height) s.y = 0;
        ctx.beginPath();
        ctx.arc(s.x, s.y, s.radius, 0, Math.PI * 2);
        ctx.fill();
      });
      requestAnimationFrame(drawStars);
    }
    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();
    drawStars();
  </script>
</body>
</html>
