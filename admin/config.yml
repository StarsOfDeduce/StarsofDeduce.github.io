backend:
  name: github
  repo: StarsofDeduce/StarsofDeduce.github.io
  branch: main
  # 指向自托管在 Cloudflare Worker 上的 GitHub OAuth 网关
  base_url: https://cmsgtio.account-subdomain.workers.dev
  auth_endpoint: auth

site_url: https://starsofdeduce.github.io
display_url: https://starsofdeduce.github.io
logo_url: https://starsofdeduce.github.io/avatar.webp?v=20261018-6

# 文章配图 / 上传文件的存放位置
media_folder: "assets/uploads"
public_folder: "/assets/uploads"

collections:
  - name: posts
    label: 文章
    label_singular: 文章
    folder: posts
    create: true
    delete: true
    slug: "{{slug}}"
    format: yaml-frontmatter
    summary: "{{date}} · {{title}}"
    sortable_fields: [date, title]
    fields:
      - label: 标题
        name: title
        widget: string
        hint: 文章标题，会同时用于浏览器标签页与分享卡片
      - label: 简介
        name: description
        widget: text
        required: false
        hint: 首页卡片与分享预览里的一句话简介
      - label: 发布日期
        name: date
        widget: datetime
        date_format: "YYYY-MM-DD"
        time_format: false
        format: "YYYY-MM-DD"
        required: false
      - label: 标签
        name: tags
        widget: list
        required: false
        hint: 例如：Electron / C++ / 设计
      - label: 正文
        name: body
        widget: markdown
        hint: 支持 Markdown：标题、列表、代码块、引用、链接等
