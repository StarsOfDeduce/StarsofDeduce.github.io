<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>404 · 页面未找到 | StarsOfDeduce</title>
  <meta name="description" content="这个页面在数字星空里走丢了。返回 StarsOfDeduce 主页。">
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#0a0d14">
  <link rel="icon" href="./avatar.png" type="image/png">
  <style>
    :root {
      --bg-base: #0a0d14;
      --bg-surface: rgba(18, 24, 38, 0.65);
      --border-subtle: rgba(255, 255, 255, 0.08);
      --border-focus: rgba(99, 102, 241, 0.4);
      --accent-cyan: #00f2fe;
      --accent-purple: #8b5cf6;
      --accent-pink: #ec4899;
      --text-main: #f3f4f6;
      --text-muted: #9ca3af;
      --text-dim: #6b7280;
      --font-sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
      --font-mono: "JetBrains Mono", Consolas, Monaco, "Courier New", monospace;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background-color: var(--bg-base);
      color: var(--text-main);
      font-family: var(--font-sans);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      overflow: hidden;
      line-height: 1.6;
    }

    #space-canvas {
      position: fixed;
      top: 0; left: 0;
      width: 100vw; height: 100vh;
      z-index: 0;
      pointer-events: none;
    }

    .ambient-glow {
      position: fixed;
      border-radius: 50%;
      filter: blur(120px);
      pointer-events: none;
      z-index: 0;
      opacity: 0.35;
      animation: floatGlow 18s ease-in-out infinite alternate;
    }
    .glow-1 { top: -10%; left: 15%; width: 500px; height: 500px; background: radial-gradient(circle, rgba(99, 102, 241, 0.5), transparent 70%); }
    .glow-2 { bottom: 5%; right: 10%; width: 600px; height: 600px; background: radial-gradient(circle, rgba(0, 242, 254, 0.35), transparent 70%); animation-delay: -9s; }

    @keyframes floatGlow {
      0% { transform: translate(0, 0) scale(1); }
      100% { transform: translate(60px, 40px) scale(1.15); }
    }

    .card {
      position: relative;
      z-index: 1;
      max-width: 560px;
      margin: 24px;
      padding: 48px 40px;
      text-align: center;
      background: var(--bg-surface);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid var(--border-subtle);
      border-radius: 20px;
      box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.15);
    }

    .error-code {
      font-family: var(--font-mono);
      font-size: 4.5rem;
      font-weight: 800;
      line-height: 1;
      letter-spacing: -0.03em;
      background: linear-gradient(135deg, var(--accent-cyan), var(--accent-purple), var(--accent-pink));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 12px;
    }

    .card h1 {
      font-size: 1.3rem;
      font-weight: 700;
      margin-bottom: 10px;
    }

    .card p {
      font-size: 0.92rem;
      color: var(--text-muted);
      margin-bottom: 28px;
    }

    .btn-glass {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 9px 22px;
      border-radius: 100px;
      font-size: 0.9rem;
      font-weight: 600;
      color: #fff;
      background: linear-gradient(135deg, #6366f1 0%, #4f46e5 100%);
      border: 1px solid rgba(165, 180, 252, 0.3);
      text-decoration: none;
      box-shadow: 0 4px 14px rgba(99, 102, 241, 0.35);
      transition: all 0.25s ease;
      cursor: pointer;
    }
    .btn-glass:hover {
      box-shadow: 0 6px 20px rgba(99, 102, 241, 0.5);
      transform: translateY(-2px);
    }

    .meta {
      margin-top: 22px;
      font-size: 0.76rem;
      color: var(--text-dim);
      font-family: var(--font-mono);
    }

    ::selection { background: rgba(139, 92, 246, 0.35); }

    @media (max-width: 640px) {
      .card { padding: 36px 24px; }
      .error-code { font-size: 3.4rem; }
    }
  </style>
</head>
<body>
  <canvas id="space-canvas"></canvas>
  <div class="ambient-glow glow-1"></div>
  <div class="ambient-glow glow-2"></div>

  <div class="card">
    <div class="error-code">404</div>
    <h1>这个页面在数字星空里走丢了 🌌</h1>
    <p>请求的页面不存在、已被移动，或只是暂时偏离了轨道。回到主页继续探索吧。</p>
    <a href="./index.html" class="btn-glass">← 返回 StarsOfDeduce 主页</a>
    <div class="meta">error.status = 404 // not found in this timeline</div>
  </div>

  <script>
    const canvas = document.getElementById('space-canvas');
    const ctx = canvas.getContext('2d');
    let width, height, stars = [];

    function resizeCanvas() {
      width = canvas.width = window.innerWidth;
      height = canvas.height = window.innerHeight;
      stars = [];
      for (let i = 0; i < 70; i++) {
        stars.push({
          x: Math.random() * width,
          y: Math.random() * height,
          radius: Math.random() * 1.5 + 0.5,
          vx: (Math.random() - 0.5) * 0.3,
          vy: (Math.random() - 0.5) * 0.3,
          alpha: Math.random() * 0.7 + 0.3
        });
      }
    }

    function drawStars() {
      ctx.clearRect(0, 0, width, height);
      ctx.fillStyle = 'rgba(165, 180, 252, 0.55)';
      stars.forEach(s => {
        s.x += s.vx; s.y += s.vy;
        if (s.x < 0) s.x = width; if (s.x > width) s.x = 0;
        if (s.y < 0) s.y = height; if (s.y > height) s.y = 0;
        ctx.beginPath();
        ctx.arc(s.x, s.y, s.radius, 0, Math.PI * 2);
        ctx.fill();
      });
      requestAnimationFrame(drawStars);
    }
    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();
    drawStars();
  </script>
</body>
</html>
